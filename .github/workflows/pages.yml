name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand and assemble
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          raw = p.read_bytes()
          text = raw.decode('utf-8', 'replace')
          head, sep, rest = text.partition('</title>')
          if sep:
              start = head.rfind('<title>')
              if start >= 0:
                  text = head[:start] + '<title>Wuu-Tavern</title>' + rest
          extra = '\n<script src="./ot-boot.js"></script>\n<script src="./ot-status.js"></script>\n'
          if 'src="./ot-boot.js"' not in text:
              text = text + extra
          p.write_text(text, encoding='utf-8')
          print('ready', p.stat().st_size)
          PY
          mkdir -p dist
          cp index.html worker.js icon.png ot-boot.js ot-status.js ot-rp.js ot-quick.js dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
