name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official OpenTavern files
        run: |
          mkdir -p dist
          curl -fsSL https://opentavern.pages.dev/ -o dist/index.html
          curl -fsSL https://opentavern.pages.dev/worker.js -o dist/worker.js
          curl -fsSL https://opentavern.pages.dev/icon.png -o dist/icon.png
          cp ot-status.js dist/ot-status.js
          touch dist/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8', errors='replace')
          if 'OpenTavern' not in html:
              raise SystemExit('upstream is not OpenTavern')
          tag = '<script src="./ot-status.js"></script>\n'
          if 'src="./ot-status.js"' not in html:
              idx = html.lower().rfind('</body>')
              if idx >= 0:
                  html = html[:idx] + tag + html[idx:]
              else:
                  html += tag
          p.write_text(html, encoding='utf-8')
          print('baked', p.stat().st_size)
          PY
          cp dist/index.html index.html
          cp dist/worker.js worker.js
          cp dist/icon.png icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Push official files to main for branch Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html worker.js icon.png ot-status.js .nojekyll
          if git diff --staged --quiet; then
            echo no change
          else
            git commit -m "chore: sync official OpenTavern files [skip ci]"
            git push
          fi
