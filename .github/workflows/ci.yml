name: Safe upgrade checks
# A feature push already tests same-repository PRs. Avoid duplicate
# pull_request jobs and duplicate failure notification emails.
on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check ot-boot.js
          node --check ot-status.js
          node --check ot-rp.js
          node --check ot-quick.js
          node --check ot-memory.js
          node --check wuu-ledger.js
      - name: Regression tests
        run: node --test tests/*.test.cjs
