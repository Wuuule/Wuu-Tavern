name: Safe upgrade checks

on:
  pull_request:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check ot-boot.js
          node --check ot-status.js
          node --check ot-rp.js
          node --check ot-quick.js
          node --check ot-memory.js
          node --check wuu-ledger.js
      - name: Status Center regression tests
        run: node --test tests/*.test.cjs
