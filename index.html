<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wuu-Tavern</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #boot { padding: 24px; max-width: 32rem; line-height: 1.6; }
    #boot a { color: #fbbf24; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  </style>
</head>
<body>
  <div id="boot">Loading OpenTavern…</div>
  <iframe id="app" title="OpenTavern" allow="clipboard-read; clipboard-write"></iframe>
  <script>
  (async function () {
    var boot = document.getElementById('boot');
    var frame = document.getElementById('app');
    var sources = ['https://opentavern.pages.dev/', 'https://hajimides.github.io/OpenTavern/'];
    var hook = new URL('ot-status.js', location.href).href;
    function patch(html) {
      var tag = '<script src="' + hook + '"><\/script>\n';
      if (html.indexOf('ot-status.js') !== -1) return html;
      if (/<\/body>/i.test(html)) return html.replace(/<\/body>/i, tag + '</body>');
      return html + tag;
    }
    var lastErr = null;
    for (var i = 0; i < sources.length; i++) {
      try {
        var res = await fetch(sources[i], { cache: 'no-cache', mode: 'cors' });
        if (!res.ok) throw new Error(sources[i] + ' HTTP ' + res.status);
        var html = await res.text();
        if (html.indexOf('<html') === -1) throw new Error('not a full page');
        frame.srcdoc = patch(html);
        frame.style.display = 'block';
        boot.style.display = 'none';
        return;
      } catch (err) { lastErr = err; }
    }
    boot.innerHTML = '<p>Overlay failed. Open upstream:</p><p><a href="https://opentavern.pages.dev/">opentavern.pages.dev</a></p><p><small>' + String(lastErr && lastErr.message || lastErr || '') + '</small></p>';
  })();
  </script>
</body>
</html>
