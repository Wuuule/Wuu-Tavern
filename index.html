<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wuu-Tavern</title>
  <style>html,body{margin:0;min-height:100%;background:#09090b;color:#e4e4e7;font-family:system-ui,sans-serif;}#boot{padding:24px;max-width:28rem;}</style>
</head>
<body>
  <div id="boot">正在载入 OpenTavern + 状态中心…</div>
  <script>
  (async function () {
    var boot = document.getElementById('boot');
    var sources = ['https://opentavern.pages.dev/','https://hajimides.github.io/OpenTavern/'];
    function patch(html) {
      if (html.indexOf('ot-status.js') !== -1) return html;
      var tag = '<script src="./ot-status.js"><\/script>\n';
      if (/<\/body>/i.test(html)) return html.replace(/<\/body>/i, tag + '</body>');
      return html + tag;
    }
    var lastErr = null;
    for (var i = 0; i < sources.length; i++) {
      try {
        var res = await fetch(sources[i], { cache: 'no-cache', mode: 'cors' });
        if (!res.ok) throw new Error(sources[i] + ' HTTP ' + res.status);
        var html = await res.text();
        if (html.indexOf('function persistState') === -1) throw new Error('不是 OpenTavern');
        document.open(); document.write(patch(html)); document.close(); return;
      } catch (err) { lastErr = err; }
    }
    boot.innerHTML = '无法加载。先打开 GitHub Pages 再刷新。<br><small>' + String(lastErr && lastErr.message || lastErr || '') + '</small>';
  })();
  </script>
</body>
</html>
